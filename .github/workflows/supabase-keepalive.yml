name: Supabase keepalive

# Supabase pauses free-tier projects after ~7 days without API activity.
# Ping it twice a week (Mon + Thu) so the project never sleeps.
on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database via REST API
        # Anon has no table grants, so this returns 401 — but the query still
        # reaches Postgres, which is what counts as activity. Any HTTP response
        # below 500 means the project is awake.
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_settings?select=user_id&limit=1")
          echo "REST API responded with HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "Supabase appears to be down or paused" >&2
            exit 1
          fi

      - name: Check auth service health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health")
          echo "Auth health responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            echo "Auth service is not healthy" >&2
            exit 1
          fi
